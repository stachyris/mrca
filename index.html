<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Genealogy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <h1><span id="title">Academic Genealogy</span><span class="subtitle" id="subtitle"></span></h1>
  <div class="controls">
    <input class="search-box" id="search" type="search" placeholder="Search name, topic, place…">
    <div class="filters" id="filters"></div>
    <button class="filter-btn load-btn" id="loadBtn" type="button">Load CSV</button>
    <input type="file" id="fileInput" accept=".csv,text/csv" hidden>
  </div>
</header>

<div class="main">
  <div class="stage">
    <canvas id="canvas"></canvas>
    <button class="fit-btn" id="fitBtn" type="button" title="Fit to view">Fit</button>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<div class="legend" id="legend"></div>
<div class="hint">Scroll or pinch to zoom · Drag to pan · Click a node for details · Drop a CSV anywhere to load it</div>
<div class="drop-overlay" id="dropOverlay">Drop CSV to load</div>

<script src="assets/app.js"></script>
</body>
</html>
